name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Tests use this pinned local snapshot; the test scripts never fetch it.
      - uses: actions/checkout@v4
        with:
          repository: darianbr/makefiles
          ref: ecb127ac02953f599c5eac7c7ca03daae787ebe2
          path: .ci/makefiles
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(find . -name '*.go' -not -path './vendor/*' -exec gofmt -l {} +)
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go test ./...
      - run: go vet ./...
      - name: Test offline Make integration
        shell: bash
        env:
          MAKEFILES_CORE_GIT: ${{ github.workspace }}/.ci/makefiles
        run: |
          bash tests/make-bootstrap.sh
          bash tests/wtree-module.sh
      - name: Test release asset validator
        run: bash scripts/check-release-assets.sh